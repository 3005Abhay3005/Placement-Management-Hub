apiVersion: apps/v1
kind: Deployment
metadata:
  name: placementhub
  labels:
    app: placementhub
    version: "1.0"
    course: devops-24ESKCS010
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placementhub
  template:
    metadata:
      labels:
        app: placementhub
    spec:
      containers:
        - name: placementhub
          image: ghcr.io/skit-devops-2026/devops-24eskcs010:latest
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
